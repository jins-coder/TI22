<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 240" width="100%" height="100%">
  <defs>
    <linearGradient id="logo-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="logo-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Left Icon Emblem (200x200 centered) -->
  <g transform="translate(20, 20)">
    <rect width="200" height="200" rx="50" fill="#0c111e" stroke="url(#logo-accent)" stroke-width="2.5" stroke-opacity="0.4"/>
    <polygon points="100,24 168,64 168,136 100,176 32,136 32,64" 
             fill="none" stroke="url(#logo-accent)" stroke-width="5" stroke-linejoin="round" filter="url(#logo-glow)"/>
    <text x="100" y="66" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="800" fill="#38bdf8" text-anchor="middle" letter-spacing="2">22</text>
    <text x="100" y="124" font-family="'Plus Jakarta Sans', sans-serif" font-size="52" font-weight="900" fill="url(#logo-accent)" text-anchor="middle" filter="url(#logo-glow)">Ti</text>
    <text x="100" y="152" font-family="'Plus Jakarta Sans', sans-serif" font-size="10" font-weight="800" fill="#94a3b8" text-anchor="middle" letter-spacing="4">NATIVE</text>
  </g>

  <!-- Right Typography -->
  <g transform="translate(250, 40)">
    <!-- Main Title -->
    <text x="0" y="80" font-family="'Plus Jakarta Sans', sans-serif" font-size="76" font-weight="900" fill="#ffffff" letter-spacing="2">
      TITANIUM <tspan fill="url(#logo-accent)">X</tspan>
    </text>
    <!-- Subtitle / Tagline -->
    <text x="5" y="125" font-family="'JetBrains Mono', monospace" font-size="18" font-weight="700" fill="#38bdf8" letter-spacing="3">
      NATIVE MULTI-PARADIGM WEB RUNTIME
    </text>
    <text x="5" y="155" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="600" fill="#64748b" letter-spacing="1">
      DUAL ENGINE • REALTIME WEBSOCKETS • SINGULARITY AI • SUPERCLUSTER
    </text>
  </g>
</svg>
