<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c111e"/>
      <stop offset="100%" stop-color="#03060c"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Hexagon Shield -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)"/>
  <rect width="504" height="504" x="4" y="4" rx="124" fill="none" stroke="url(#accent-grad)" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Atomic Orbital Hexagon Ring -->
  <polygon points="256,64 420,160 420,352 256,448 92,352 92,160" 
           fill="none" 
           stroke="url(#accent-grad)" 
           stroke-width="12" 
           stroke-linejoin="round"
           filter="url(#neon-glow)"
           stroke-dasharray="14 8"
           opacity="0.85"/>

  <!-- Inner Hexagon Frame -->
  <polygon points="256,96 392,176 392,336 256,416 120,336 120,176" 
           fill="#0c111e" 
           fill-opacity="0.75"
           stroke="#38bdf8" 
           stroke-width="6" 
           stroke-opacity="0.6"/>

  <!-- Core Element Typography -->
  <!-- Atomic Number 22 -->
  <text x="256" y="170" 
        font-family="'JetBrains Mono', monospace" 
        font-size="32" 
        font-weight="800" 
        fill="#38bdf8" 
        text-anchor="middle" 
        letter-spacing="4">22</text>

  <!-- Element Symbol "Ti" -->
  <text x="256" y="295" 
        font-family="'Plus Jakarta Sans', sans-serif" 
        font-size="120" 
        font-weight="900" 
        fill="url(#accent-grad)" 
        text-anchor="middle"
        filter="url(#neon-glow)">Ti</text>

  <!-- Subtitle "TITANIUM" -->
  <text x="256" y="360" 
        font-family="'Plus Jakarta Sans', sans-serif" 
        font-size="24" 
        font-weight="800" 
        fill="#f8fafc" 
        text-anchor="middle" 
        letter-spacing="8">TITANIUM</text>

  <!-- Node Dots on Vertices -->
  <circle cx="256" cy="64" r="10" fill="#38bdf8"/>
  <circle cx="420" cy="160" r="10" fill="#818cf8"/>
  <circle cx="420" cy="352" r="10" fill="#c084fc"/>
  <circle cx="256" cy="448" r="10" fill="#38bdf8"/>
  <circle cx="92" cy="352" r="10" fill="#818cf8"/>
  <circle cx="92" cy="160" r="10" fill="#c084fc"/>
</svg>
